[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pwv-repro"
version = "0.1.0"
description = "Reproducibility utilities for retinal-image arterial-stiffness experiments"
requires-python = ">=3.8"
dependencies = [
  "numpy==1.24.4",
  "pandas==2.0.3",
  "Pillow==9.5.0",
  "openpyxl==3.1.2",
  "scipy==1.10.1",
  "scikit-learn==1.3.0",
]

[project.optional-dependencies]
test = ["pytest>=7,<9", "scikit-image==0.21.0", "opencv-python==4.8.0.76", "PyYAML==6.0.1"]
explainability = [
  "matplotlib==3.7.3",
  "shap==0.44.1",
]
inference = [
  "Pillow==9.5.0",
  "torch==2.0.1",
  "torchvision==0.15.2",
  "timm==0.6.7",
  "safetensors==0.3.1",
]
architecture-verification = [
  "Pillow==9.5.0",
  "torch==2.0.1",
  "torchvision==0.15.2",
  "timm==0.9.2",
  "safetensors==0.3.1",
  "ptflops==0.7.3",
]
training = [
  "Pillow==9.5.0",
  "torch==2.0.1",
  "torchvision==0.15.2",
  "timm==0.9.2",
  "safetensors==0.3.1",
  "hydra-core==1.1.0",
  "omegaconf==2.1.2",
  "albumentations==0.4.6",
  "torchmetrics==0.4.0",
  "opencv-python==4.8.0.76",
  "ptflops==0.7.3",
  "torch-ema==0.3",
  "PyYAML==6.0.1",
]
analysis = ["matplotlib==3.7.2", "scikit-image==0.21.0", "opencv-python==4.8.0.76", "PyYAML==6.0.1"]

[project.scripts]
pwv-repro = "pwv_repro.public_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
